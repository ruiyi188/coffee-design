<script>
// Settings page interactivity
document.addEventListener('DOMContentLoaded', function() {
  // Notification click
  document.querySelectorAll('[data-action]').forEach(function(el) {
    el.addEventListener('click', function() {
      var action = el.getAttribute('data-action');
      if (window.AppUtils && window.AppUtils.showNotification) {
        window.AppUtils.showNotification(action + ' 功能即将开放');
      }
    });
  });

  // Logout click
  var logoutBtn = document.querySelector('.text-error');
  if (logoutBtn) {
    logoutBtn.closest('div').addEventListener('click', function() {
      if (window.AppUtils && window.AppUtils.showNotification) {
        window.AppUtils.showNotification('已退出登录');
      }
    });
  }
});
</script>
